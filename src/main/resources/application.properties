spring.datasource.url=jdbc:mysql://${CHAVE_SQL_HOST}/${CHAVE_SQL_DB}
spring.datasource.username=${CHAVE_SQL_USER}
spring.datasource.password=${CHAVE_SQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.application.name=AppStudying
spring.ai.openai.api-key=placeholder

# O schema é gerenciado pelo Flyway (src/main/resources/db/migration); o
# Hibernate só confere se as entidades batem com o banco, nunca altera nada.
spring.jpa.hibernate.ddl-auto=validate
# As tabelas SPRING_SESSION* já vêm da migration V1__init.sql, então o
# spring-session não deve tentar recriá-las sozinho a cada start.
spring.session.jdbc.initialize-schema=never

server.error.include-message=always
spring.docker.compose.skip.in-tests=false

# Plataformas como Railway/Render injetam a porta via variável PORT; localmente
# cai no padrão 8080.
server.port=${PORT:8080}

# Em dev, o proxy do Vite (localhost:5173 -> 8080) preserva o header Origin
# original, então essa origem precisa estar liberada explicitamente pro
# WebSocket (ver webSocketConfiguration.java). Em produção (perfil prod) isso
# é sobrescrito para vazio, porque front e back são servidos pela mesma origem.
app.cors.allowed-origins=http://localhost:5173

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# SMTP do Gmail: MAIL_USERNAME é o endereço @gmail.com, MAIL_PASSWORD é uma
# "senha de app" gerada em myaccount.google.com/apppasswords (não a senha
# normal da conta — login e verificação em 2 etapas precisam estar ativos).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Origem pública usada para montar o link de verificação enviado por e-mail.
app.mail.verification-base-url=${APP_BASE_URL:http://localhost:5173}
