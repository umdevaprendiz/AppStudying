# Ativado com SPRING_PROFILES_ACTIVE=prod (é isso que o Dockerfile/deploy usa).
# Só contém as diferenças em relação ao application.properties base.

# Front e back saem do mesmo container/origem em produção (o build do React é
# copiado para src/main/resources/static no Dockerfile), então nenhuma origem
# externa precisa ser liberada em CORS nem no WebSocket.
app.cors.allowed-origins=

# Produção deve sempre servir por HTTPS; o cookie de sessão não deve trafegar
# em texto claro por HTTP.
server.servlet.session.cookie.secure=true

# Evita subir o docker-compose local (banco de dev) quando a app já recebe as
# credenciais reais via variáveis de ambiente da plataforma de deploy.
spring.docker.compose.enabled=false
