app.cors.allowed-origins=

server.servlet.session.cookie.secure=true

# O Render fica na frente da aplicacao como proxy reverso; sem isso,
# request.getRemoteAddr() sempre retorna o IP interno do proxy, nao o do
# cliente real - o que quebraria o rate limit por IP do cadastro (todo mundo
# pareceria vir do mesmo lugar). Isso faz o Spring ler o IP real do header
# X-Forwarded-For, que so o proxy do Render consegue setar.
server.forward-headers-strategy=framework

# Documentacao interativa da API (Swagger UI / OpenAPI JSON) so faz sentido
# em dev - em producao e so superficie de reconhecimento gratis pra quem
# quiser mapear a API sem estar autenticado.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.docker.compose.enabled=false

# O banco (Aiven) fica em outro provedor/rede que o Render, entao cada conexao
# nova custa mais tempo (latencia + handshake SSL) do que num banco local. Um
# pool grande (padrao: 10) so faz esperar mais tentativas simultaneas lentas
# em vez de resolver algo - reduzimos pra caber no que o plano gratuito
# aguenta com folga e falhar mais rapido/claro se algo travar de verdade.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
